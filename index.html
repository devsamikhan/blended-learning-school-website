<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>BLS Isakhel | Blended Learning School</title>
    <meta name="description" content="Institutional Management Ecosystem for Blended Learning School, Isakhel." />
    <meta name="theme-color" content="#0f172a" />

    <!-- PWA & Icon Paths (Zahir bahi's /student/ prefix removed for Universal Build) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./placeholder.svg" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BLS ESAKHEL">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Institutional OpenGraph (Social Media Preview) -->
    <meta property="og:title" content="BLS Isakhel" />
    <meta property="og:description" content="Official Portal for Blended Learning School Students, Staff, and Parents." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./assets/campus_exterior_v2.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    
    <script>
      // Global PWA Event Capture
      window.deferredPWAEvent = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAEvent = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
    </script>
    
    <!-- Vite entry point: Build ke waqt ye automatically replace ho jayega -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
